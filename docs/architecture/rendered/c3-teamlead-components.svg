g><g class="nodes"><g class="node default logic" id="my-svg-flowchart-remote-14" data-look="classic" transform="translate(805.3671875, 6149)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-143.6875" y="-183" width="287.375" height="366"/><g class="label" style="color:#eef1f6 !important" transform="translate(-113.6875, -168)"><rect/><foreignObject width="227.375" height="336"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>remoteDataset.ts<br /><i>fetchCockpit() → capacity·dashboard·kpis·board (je Beleg sharedWith = aktive Helfer, 31.08.2026)·events·ablagen<br />Lanes + Pool-Kennzahlen aus dem VOLLSTÄNDIGEN /api/teamlead/ablagen (nicht aus einer Seite der Belege-Liste):<br />buildLanes() bucketet nur noch, die Zugehörigkeit entscheidet der Server</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-cockpit-1" data-look="classic" transform="translate(200.265625, 3659)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-137.265625" y="-459" width="274.53125" height="918"/><g class="label" style="color:#eef1f6 !important" transform="translate(-107.265625, -444)"><rect/><foreignObject width="214.53125" height="888"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>cockpit/CockpitPage + SchnellaktionenFlyout<br /><i>§10.1 Steuerzentrale: Verteilungsstatus · „Schnellaktionen“-Entscheidungsliste<br />(schnellaktionen.tsx, aus lanes + board — Single-Source) · SimulationPanel · Automatik-Schalter ·<br />Flyout: Trapez-Knopf außen an der Nav-Rail (rot NUR bei un-abgehakten Meldungen, blaues Dreieck)<br />klappt die Liste als zweite Sidebar aus (AppShell, geöffnet über ALLEN Ebenen) ·<br />Meldungen abhakbar (Haken statt Zahl, localStorage key→count, geteilt Cockpit↔Flyout;<br />Aktions-Klick hakt NICHT ab — Sprung ins Experiment DA.M.B: Ziel-Fenster Vollbild + 3-s-Fokus, experiment/fokus.ts) ·<br />leer → Panel schließt, Knopf fährt langsam ein · Nachrichten-Lesestatus (data/nachrichten.ts, „Gelesen“-Quittung) · „Starterbündel generiert“ (experiment/starterStatus.ts) ·<br />Automatik-Schalter geteilt via automatik.ts</i></p></span></div></foreignObject></g></g><g class="node default store" id="my-svg-flowchart-store-11" data-look="classic" transform="translate(805.3671875, 5682.5)"><rect class="basic label-container" style="fill:#143a35 !important;stroke:#2dd4a7 !important" x="-130" y="-135" width="260" height="270"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -120)"><rect/><foreignObject width="200" height="240"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>data/store.tsx — CockpitDataProvider<br /><b>useCockpitData() : CockpitApi</b><br /><i>View-Models + Mutationen (TanStack Query) · neue Mutation removeParticipant (31.08.2026) · mountet useCockpitLive</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-ablagen-2" data-look="classic" transform="translate(1962.96484375, 3659)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-171.453125" y="-303" width="342.90625" height="606"/><g class="label" style="color:#eef1f6 !important" transform="translate(-141.453125, -288)"><rect/><foreignObject width="282.90625" height="576"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>ablagen/AblagenBoard<br /><i>§10.2 Kanban (8 Lanes: probleme→weitergeleitet→geparkt→… · verschiebbar + einklappbar, persistiert) ·<br />ohne Überschrift, Filterleiste hinter Ausklapp-Button · einbettbar (embedded · viewStateKey · dnd-Hooks) —<br />die GANZE Karte ist der Drag-Griff (voller Geist); ziehbar nur über die dnd-Hooks des Experiments ·<br />Problem-Karten: „n Meldungen · m offen“ + Aufklappen ALLER Meldungen (Art/Pos/Zeit/Einzel-Status) →<br />InstructionsDialog (components/): je Meldung Pflichttext, einzeln absendbar (Instruktions-Loop 04.08.2026) ·<br />je Karte eine kompakte Infozeile (BelegInfoChips): Filiale · Shop · Etikett/Digi Tag · Sicherung (07.08.2026)</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-board-3" data-look="classic" transform="translate(2399.51953125, 3659)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-130" y="-591" width="260" height="1182"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -576)"><rect/><foreignObject width="200" height="1152"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>board/MitarbeiterBoard<br /><i>§10.3 Mitarbeiter × Bündel · Liste ↔ Kanban-Raster (KanbanBoard: Laufend/Geplant,<br />Drag-&amp;-Drop-Umhängen) · Schnellinfo „!“ je Beleg (CaseQuickInfoContent/-Tooltip, geteilt mit der Matrix) ·<br />Bündel anlegen (AssignDialog, A1/A2 — je Beleg-Zeile dieselbe BelegInfoChips-Zeile wie auf den Ablagen-Karten) ·<br />Beleg verschieben (MoveCaseDialog, B2) ·<br />geteilte Belege GOLDEN (31.08.2026): Kanban-CaseCard, Listen-Zeile (EmployeeRow) und Matrix-Belegstrich mit Rahmen/Left-Border in ltColors.shared + Gruppen-Icon,<br />mittig zwischen Nummer und „N Teile“: „mit &lt;Name&gt;“ bzw. „&lt;n&gt;×“ (Tooltip: Namen + Status, teil_erledigt grau) — Daten: BoardCase.sharedWith ·<br />Rechtsklick (onContextMenu) oder kleines PersonRemove-Icon (Touch) → Menü „Aus geteiltem Beleg entfernen: &lt;Name&gt;“ je Helfer<br />→ requestReason (Pflichtgrund; Vorschläge „Anderweitig gebraucht“ · „Falsch eingeladen“ · „Schichtende“) → removeParticipant → invalidate cockpit/beleg/belege; Fehler in der Snackbar-Liste</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-belege-4" data-look="classic" transform="translate(773.55078125, 3659)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-217.3671875" y="-411" width="434.734375" height="822"/><g class="label" style="color:#eef1f6 !important" transform="translate(-187.3671875, -396)"><rect/><foreignObject width="374.734375" height="792"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>belege/BelegListPage + BelegDetailPage + AssignFromListDialog<br /><i>§10.4 servergetriebene Liste + Detail; Spalten je Ansicht ausblendbar (Kopf-Icon) und über das<br />„Spalten“-Menü zurückholbar (persistiert am viewStateKey, Basis-Reiter und DA.M.B getrennt);<br />Filter u. a. Etiketten · Digi Tags · Sichern · Monster (alle server-seitig);<br />Beleg-Tab = Kopf+Positionen+Probleme in EINER Ansicht<br />(BelegTab/PositionsSection, PWA-Vorlage: Positions-Kontext HS/Shop/Etage/Filiale/Bereich/CatMan + EK/VK/VK-Etikett je Größe;<br />Reiter: Beleg·Verlauf·Aufwand·Abschluss·Historie·Priorität);<br />Klärungs-UX (IssuesTab): je Meldung Einzel-Status (Offen/Instruktion gesendet) + Instruktionstext → „Instruktionen senden“ (InstructionsDialog);<br />VerlaufTab: je betroffener Position ein TAB — kompletter Nachrichten-Verlauf (IssueMessageList) +<br />Antwort-Feld der TL auf offene Meldungen/Rückmeldungen (gleiche Instruktions-Aktion wie der Dialog);<br />BelegDetailPage (31.08.2026): Chip „Gemeinsam bearbeitet“ (GeteiltChip) + Beteiligtenliste (Name · Rolle Inhaber/Helfer · Status · Zeit) mit Entfernen-Aktion —<br />fertige Belege behalten ihre Beteiligten („wurde zusammengearbeitet“ bleibt sichtbar); Historie zeigt die case.collaboration_*-Ereignisse (Labels in data/audit.ts)</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-split-5" data-look="classic" transform="translate(1611.51171875, 3659)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-130" y="-495" width="260" height="990"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -480)"><rect/><foreignObject width="200" height="960"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>split/SplitDialog + useSplitCase<br /><i>Oberste Wahl „Wie wird gearbeitet?“ (31.08.2026): Modus „Gemeinsam bearbeiten“ (VORAUSGEWÄHLT) — Info „Alle Beteiligten sehen den ganzen Beleg und arbeiten ihn zusammen ab.<br />Der erste Mitarbeiter bekommt den Beleg in seinen Karren.“, Checkbox-Mehrfachauswahl ≥ 2 Mitarbeiter (Klickreihenfolge, der erste trägt „Karren“), Pflicht-Grund, Aktion „Gemeinsam zuweisen“<br />→ createCollaboration (EIN Beleg, Beteiligte als Overlay) · Modus „In Teil-Belege aufteilen“ = bisheriger Dialog: ECHTE Teil-Belege, mit oder ohne Zuweisung<br />(„Ohne Zuweisung“ = Teile gehen als bereite Belege in den Topf, die Automatik verteilt) → splitCase ·<br />SplitSubmit ist eine Union { mode: 'gemeinsam' | 'aufteilen' }; die drei Aufrufer (Belege-Liste, Beleg-Detail, Ablagen) bleiben unverändert ·<br />splitMath.ts liefert nur Eingabehilfen; Mengenverteilung/Guards rechnet das Backend</i></p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-belegeData-15" data-look="classic" transform="translate(2415.46484375, 6149)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-130" y="-219" width="260" height="438"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -204)"><rect/><foreignObject width="200" height="408"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>belege.ts (Detail-Mapping inkl. participants · splitCase · createCollaboration, 31.08.2026) · admin.ts (RuleConfig inkl. collaboration) · employees.ts ·<br />audit.ts (Labels, u. a. „Gemeinsam zugewiesen“ · „Zur Zusammenarbeit eingeladen“ · „Einladung angenommen/abgelehnt“ · „Teilbeleg erledigt“ · „Aus geteiltem Beleg entfernt“ · „Zusammenarbeit beendet“) · nachrichten.ts</p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-geteiltChip-13" data-look="classic" transform="translate(693.71484375, 4917.5)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-130" y="-183" width="260" height="366"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -168)"><rect/><foreignObject width="200" height="336"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>components/GeteiltChip (31.08.2026)<br /><i>EIN wiederverwendeter Chip/Text für „geteilt“: Gruppen-Icon + „mit &lt;Name&gt;“ bzw. „&lt;n&gt;×“ + Tooltip (Namen mit Status, teil_erledigt grau) —<br />geteilt von Kanban-Karte, Listen-Zeile, Matrix-Strich und Beleg-Detail; Farbe = Token ltColors.shared (Gold) aus @paket/ui tokens.ts</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-experiment-9" data-look="classic" transform="translate(1962.96484375, 1526)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-184.71875" y="-1443" width="369.4375" height="2886"/><g class="label" style="color:#eef1f6 !important" transform="translate(-154.71875, -1428)"><rect/><foreignObject width="309.4375" height="2856"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>experiment/ExperimentPage („Experiment DA.M.B“)<br /><i>randloser 3-Fenster-Workspace: Beleg-Fenster als FLIP-KARTE (Tasche-Knopf mittig in der Kopfleiste):<br />vorn Beleg-Liste (eingebettet, Füll-Modus — Tabelle bis ganz unten), hinten VorverteilungPane —<br />Engine-Preview-Bündel (POST assignments/preview → bundles, Single-Source) als Grid im Matrix-Pack-Look<br />(Beleg-Striche via matrixPacks.stripStyle, MA-Vorschlag klickbar wechselbar), darunter EIN MA-Container<br />1./2./3. untereinander (je Zeile ein eigener Kasten) mit Bündel-Fortschrittsbalken je Name; Zahnrad (Anzahl 1–6 + Sperre);<br />Starterbündel-Ansicht (Knopf unten statt Vorschau-Hinweis): Schichtstart ≤ 1 h, orange Vorschläge — Klick übernimmt<br />bzw. Toggler „Automatisch übernehmen/erstellen“, echte Zuweisung exakt zum Schichtbeginn (assignBundle),<br />Generierung → Schnellaktionen-Popout (starterStatus.ts),<br />leer: „Kommende Starter anschauen“ — Container je Schichtgruppe Früh-/Spätschicht (weeklyPattern, Grid max 4/Reihe),<br />geteilter Automatik-Schalter, Pfeile/✕ je Beleg, DnD Ablage↔Bündel,<br />Bündel-Kopf auf Matrix-Zeile ziehen = echtes A1/A2-Zuweisen ·<br />AblagenPane = eingebettetes ORIGINAL-AblagenBoard<br />(eigener Saved-View-Key · dnd-Hooks: Lane-Drops parken/entparken/priorisieren/weiterleiten ·<br />Matrix-Drag → Vollflächen-POOL-RÜCKGABE: blauer Schleier + Recycling = entziehen,<br />3 s halten = Zielwahl Geparkt/Prio/Weiterleiten als withdraw-Kette) ·<br />MatrixBoard (ein Rechteck je Engine-Pack aus BoardRow.packs — die Pack-Zugehörigkeit kommt PERSISTIERT vom Backend<br />(AssignmentItem.packIndex), auch für manuell Zugewiesenes/Einsortiertes; je Pack steht sein Stand beim MA:<br />„abgearbeitet“ / „aktiv beim MA“ / „vorgeplant“ — vorgeplante sind in seiner App noch unsichtbar —, INNEN aufgeteilt wie die Board-Karte:<br />Laufend (n) / Geplant (n) / Fertig (n) · Belegstriche mit Statusfarben + Zugehörigkeits-Zeile,<br />Hover → Schnellinfo der Board-Karte, Klick → Belegdetails, Info-Kreis MatrixInfo + Zeilen-„!“ oben rechts,<br />Schicht-Pill Früh/Spät „ab HH:MM“, Schicht-Streifen = Pausen-Schieber: wächst als Farbband über die Namenszelle,<br />durchlaufende vertikale Trennwände zwischen den Slot-Spalten + „+ Nächstes Pack“-Slot<br />(NaechstesPackDialog → assignToEmployee newPack: vorgeplantes Pack im Tages-Bündel — NIE ein Zweit-Bündel, optional Nachricht) ·<br />Ablage-Beleg zwischen GEPLANT-Striche einsortieren (assign→reorder), LAUFEND nur mit Sicherheitsfrage,<br />jedes Pack ist Dropzone (PackBox + experimentDnd.packDropAction): Beleg-Strich → anderes Pack<br />DESSELBEN MA = umhängen, → Pack eines ANDEREN MA = mitarbeiterübergreifend verschieben —<br />beides EINE moveCase-Mutation mit targetPackIndex (Zeilen-Drop bleibt „ans Bündel-Ende“);<br />nicht verschiebbare Belege (laufend/fertig, §7.1) tragen statt der Griff-Punkte ein Schloss und<br />verweigern jeden Drop (Frei/Fix) · jedes Pack ist ein gültiges Ziel (kein pack-loser Sammelkasten mehr),<br />Abwesende (krank/urlaub) ganz unten durchgestrichen) ·<br />experimentLayout.ts: 3 Anordnungen (Matrix unten/rechts/links) per Umbau-Drag über den Anschlag,<br />Hochziehen minimiert das obere Fenster bis auf die Kopfzeile (px-genau gemessen, Titelleiste bleibt bedienbar),<br />Splitter-Segmente + Vollbild + Lupe ± je Fenster (CSS-only, keine Remounts) · alle Gesten → ReasonDialog/ForwardDialog<br />→ bestehende auditierte Mutationen (experimentDnd.ts / matrixPacks.ts / lib/schichtFarben.ts);<br />beim Zuordnen/Verschieben (Ablage→MA, MA→MA, Pack→Pack) ist der Grund OPTIONAL (07.08.2026) —<br />Audit-Event wird trotzdem geschrieben, nur ggf. ohne Text; Pause/Entziehen behalten den Pflicht-Grund ·<br />Schnellaktion-Fokus (fokus.ts): Router-State → Ziel-Fenster Vollbild,<br />betroffene Ablage-Karten/Matrix-Zeilen 3 s markiert + hingescrollt ·<br />MatrixBoard: geteilte Belege als goldener Belegstrich mit „mit &lt;Name&gt;“ / „&lt;n&gt;×“ (GeteiltChip + Tooltip, geteilt mit dem Board, 31.08.2026)</i></p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-cockpitLive-12" data-look="classic" transform="translate(179.0859375, 6149)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-136.0859375" y="-195" width="272.171875" height="390"/><g class="label" style="color:#eef1f6 !important" transform="translate(-106.0859375, -180)"><rect/><foreignObject width="212.171875" height="360"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>data/useCockpitLive.ts (31.08.2026)<br /><i>erster SSE-Consumer des Cockpits: EventSource /api/teamlead/stream?token=… (Token wie api.ts) — alle Typen aus liveEventTypeSchema,<br />debounce 500 ms → invalidateQueries(['cockpit'], ['beleg'], ['belege']); Reconnect durch EventSource; ohne Token kein Absturz (Poll-Fallback bleibt)</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-admin-6" data-look="classic" transform="translate(2769.51953125, 1526)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-493.390625" y="-159" width="986.78125" height="318"/><g class="label" style="color:#eef1f6 !important" transform="translate(-463.390625, -144)"><rect/><foreignObject width="926.78125" height="288"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>admin/AdminPage<br /><i>§11: Priorität·Bündel·Aufwand·Lieferungen·Verladeplan·Lagerplätze·Mitarbeiter·Schichtplan·Integrationen·Schichtende·Problemarten ·<br />EmployeeDetailPanel: KEINE Bereich/Skill-Auswahl mehr („jeder MA macht alles“, 07.08.2026) —<br />stattdessen SkillRadar (read-only SVG-Spinne, 6 Achsen 0–5, Werte noch deterministische Platzhalter<br />aus der Personalnummer; künftig aus ZST/Problemquote) ·<br />SchichtplanTab: Wochenmuster (Schichtfarben Früh hellblau/Spät helllila/Frei orange) ⇄ Kalender<br />(SchichtplanKalender: Monats-Blöcke je Mitarbeiter, Klick → Krank/Urlaub = EmployeeAbsence, Diensttage durchgestrichen) ·<br />Tab „Bündel“ (31.08.2026): Schalter „Beim geteilten Beleg erst mithelfen“ (draft.collaboration.helpBeforeNextBundle, Standard aus) —<br />„Wer an einem geteilten Beleg beteiligt ist, bekommt kein neues Pack, bis alle Positionen geprüft sind.“</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-problemTab-7" data-look="classic" transform="translate(2769.51953125, 3659)"><r