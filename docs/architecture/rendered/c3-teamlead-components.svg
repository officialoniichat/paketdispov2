g></g><g class="edgeLabel"><g class="label" data-id="L_belegeData_apiClient_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default logic" id="my-svg-flowchart-remote-12" data-look="classic" transform="translate(2300.9140625, 5633)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-198.734375" y="-111" width="397.46875" height="222"/><g class="label" style="color:#eef1f6 !important" transform="translate(-168.734375, -96)"><rect/><foreignObject width="337.46875" height="192"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>remoteDataset.ts<br /><i>fetchCockpit() → capacity·dashboard·kpis·board·events·ablagen<br />Lanes + Pool-Kennzahlen aus dem VOLLSTÄNDIGEN /api/teamlead/ablagen (nicht aus einer Seite der Belege-Liste):<br />buildLanes() bucketet nur noch, die Zugehörigkeit entscheidet der Server</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-cockpit-1" data-look="classic" transform="translate(200.265625, 3431)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-137.265625" y="-459" width="274.53125" height="918"/><g class="label" style="color:#eef1f6 !important" transform="translate(-107.265625, -444)"><rect/><foreignObject width="214.53125" height="888"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>cockpit/CockpitPage + SchnellaktionenFlyout<br /><i>§10.1 Steuerzentrale: Verteilungsstatus · „Schnellaktionen“-Entscheidungsliste<br />(schnellaktionen.tsx, aus lanes + board — Single-Source) · SimulationPanel · Automatik-Schalter ·<br />Flyout: Trapez-Knopf außen an der Nav-Rail (rot NUR bei un-abgehakten Meldungen, blaues Dreieck)<br />klappt die Liste als zweite Sidebar aus (AppShell, geöffnet über ALLEN Ebenen) ·<br />Meldungen abhakbar (Haken statt Zahl, localStorage key→count, geteilt Cockpit↔Flyout;<br />Aktions-Klick hakt NICHT ab — Sprung ins Experiment DA.M.B: Ziel-Fenster Vollbild + 3-s-Fokus, experiment/fokus.ts) ·<br />leer → Panel schließt, Knopf fährt langsam ein · Nachrichten-Lesestatus (data/nachrichten.ts, „Gelesen“-Quittung) · „Starterbündel generiert“ (experiment/starterStatus.ts) ·<br />Automatik-Schalter geteilt via automatik.ts</i></p></span></div></foreignObject></g></g><g class="node default store" id="my-svg-flowchart-store-11" data-look="classic" transform="translate(2223.2890625, 5298.5)"><rect class="basic label-container" style="fill:#143a35 !important;stroke:#2dd4a7 !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>data/store.tsx — CockpitDataProvider<br /><b>useCockpitData() : CockpitApi</b><br /><i>View-Models + Mutationen (TanStack Query)</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-ablagen-2" data-look="classic" transform="translate(1985.7890625, 3431)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-171.453125" y="-303" width="342.90625" height="606"/><g class="label" style="color:#eef1f6 !important" transform="translate(-141.453125, -288)"><rect/><foreignObject width="282.90625" height="576"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>ablagen/AblagenBoard<br /><i>§10.2 Kanban (8 Lanes: probleme→weitergeleitet→geparkt→… · verschiebbar + einklappbar, persistiert) ·<br />ohne Überschrift, Filterleiste hinter Ausklapp-Button · einbettbar (embedded · viewStateKey · dnd-Hooks) —<br />die GANZE Karte ist der Drag-Griff (voller Geist); ziehbar nur über die dnd-Hooks des Experiments ·<br />Problem-Karten: „n Meldungen · m offen“ + Aufklappen ALLER Meldungen (Art/Pos/Zeit/Einzel-Status) →<br />InstructionsDialog (components/): je Meldung Pflichttext, einzeln absendbar (Instruktions-Loop 04.08.2026) ·<br />je Karte eine kompakte Infozeile (BelegInfoChips): Filiale · Shop · Etikett/Digi Tag · Sicherung (07.08.2026)</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-board-3" data-look="classic" transform="translate(1555.5546875, 3431)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-130" y="-219" width="260" height="438"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -204)"><rect/><foreignObject width="200" height="408"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>board/MitarbeiterBoard<br /><i>§10.3 Mitarbeiter × Bündel · Liste ↔ Kanban-Raster (KanbanBoard: Laufend/Geplant,<br />Drag-&amp;-Drop-Umhängen) · Schnellinfo „!“ je Beleg (CaseQuickInfoContent/-Tooltip, geteilt mit der Matrix) ·<br />Bündel anlegen (AssignDialog, A1/A2 — je Beleg-Zeile dieselbe BelegInfoChips-Zeile wie auf den Ablagen-Karten) ·<br />Beleg verschieben (MoveCaseDialog, B2)</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-belege-4" data-look="classic" transform="translate(2501.0078125, 3431)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-217.3671875" y="-423" width="434.734375" height="846"/><g class="label" style="color:#eef1f6 !important" transform="translate(-187.3671875, -408)"><rect/><foreignObject width="374.734375" height="816"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>belege/BelegListPage + BelegDetailPage + AssignFromListDialog<br /><i>§10.4 servergetriebene Liste + Detail; Spalten je Ansicht ausblendbar (Kopf-Icon) und über das<br />„Spalten“-Menü zurückholbar (persistiert am viewStateKey, Basis-Reiter und DA.M.B getrennt);<br />Filter u. a. Etiketten · Digi Tags · Sichern · Monster (alle server-seitig);<br />Beleg-Tab = Kopf+Positionen+Probleme in EINER Ansicht<br />(BelegTab/PositionsSection, PWA-Vorlage: Positions-Kontext HS/Shop/Etage/Filiale/Bereich/CatMan + EK/VK/VK-Etikett je Größe;<br />Reiter: Beleg·Verlauf·Aufwand·Abschluss·Historie·Priorität);<br />Klärungs-UX (IssuesTab): je Meldung Einzel-Status (Offen/Instruktion gesendet) + Instruktionstext → „Instruktionen senden“ (InstructionsDialog);<br />VerlaufTab: je betroffener Position ein TAB — kompletter Nachrichten-Verlauf (IssueMessageList) +<br />Antwort-Feld der TL auf offene Meldungen/Rückmeldungen (gleiche Instruktions-Aktion wie der Dialog);<br />Lieferungen (D2): die Liste zeigt die Lieferung VOLLSTÄNDIG — gebuchte Belege als Zeilen,<br />noch fehlende als graue Platzhalter „Ausstehend“ (lieferungZeilen.ts), beide „nicht im Pool“;<br />gebuchte, aber von der Engine gehaltene Belege stehen auf „Zurückgehalten“ (deliveryPoolHold vom Server).<br />Rechtsklick → LieferungPoolMenu: „In den Pool“ / „Zurückhalten“ je Beleg, Grund optional</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-split-5" data-look="classic" transform="translate(1186.125, 3431)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-130" y="-171" width="260" height="342"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -156)"><rect/><foreignObject width="200" height="312"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>split/SplitDialog + useSplitCase<br /><i>Beleg in ECHTE Teil-Belege aufteilen — mit oder ohne Zuweisung<br />(„Ohne Zuweisung“ = Teile gehen als bereite Belege in den Topf, die Automatik verteilt).<br />splitMath.ts liefert nur Eingabehilfen; Mengenverteilung/Guards rechnet das Backend</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-admin-6" data-look="classic" transform="translate(790.3203125, 1478)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-493.390625" y="-123" width="986.78125" height="246"/><g class="label" style="color:#eef1f6 !important" transform="translate(-463.390625, -108)"><rect/><foreignObject width="926.78125" height="216"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>admin/AdminPage<br /><i>§11: Priorität·Bündel·Aufwand·Lieferungen·Verladeplan·Lagerplätze·Mitarbeiter·Schichtplan·Integrationen·Schichtende·Problemarten ·<br />EmployeeDetailPanel: KEINE Bereich/Skill-Auswahl mehr („jeder MA macht alles“, 07.08.2026) —<br />stattdessen SkillRadar (read-only SVG-Spinne, 6 Achsen 0–5, Werte noch deterministische Platzhalter<br />aus der Personalnummer; künftig aus ZST/Problemquote) ·<br />SchichtplanTab: Wochenmuster (Schichtfarben Früh hellblau/Spät helllila/Frei orange) ⇄ Kalender<br />(SchichtplanKalender: Monats-Blöcke je Mitarbeiter, Klick → Krank/Urlaub = EmployeeAbsence, Diensttage durchgestrichen)</i></p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-belegeData-13" data-look="classic" transform="translate(938.625, 5633)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>belege.ts · admin.ts · employees.ts · audit.ts · nachrichten.ts</p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-problemTab-7" data-look="classic" transform="translate(856.125, 3431)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>admin/ProblemReasonsTab<br /><i>Problemarten-Katalog editieren (GET·PUT /api/admin/problem-reasons)</i></p></span></div></foreignObject></g></g><g class="node default dev" id="my-svg-flowchart-devtab-8" data-look="classic" transform="translate(517.53125, 3431)"><rect class="basic label-container" style="fill:#3a2d14 !important;stroke:#e5b567 !important;stroke-dasharray:4 3 !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>admin/DevScenariosTab (nur Dev, lazy)<br /><i>Szenario-Katalog (Backend-Quelle) · Zeit-Override · Quick-Knobs —<br />per Tree-Shaking aus Prod-Builds entfernt (import.meta.env-Gate, config/devPanel.ts)</i></p></span></div></foreignObject></g></g><g class="node default dev" id="my-svg-flowchart-devData-14" data-look="classic" transform="translate(602.1796875, 5633)"><rect class="basic label-container" style="fill:#3a2d14 !important;stroke:#e5b567 !important;stroke-dasharray:4 3 !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>dev.ts (nur Dev)<br /><i>/api/dev-Client mit Admin-Dev-Token (VITE_DEV_ADMIN_TOKEN)</i></p></span></div></foreignObject></g></g><g class="node default dev" id="my-svg-flowchart-devbadge-10" data-look="classic" transform="translate(686.828125, 5298.5)"><rect class="basic label-container" style="fill:#3a2d14 !important;stroke:#e5b567 !important;stroke-dasharray:4 3 !important" x="-134.296875" y="-111" width="268.59375" height="222"/><g class="label" style="color:#eef1f6 !important" transform="translate(-104.296875, -96)"><rect/><foreignObject width="208.59375" height="192"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>components/DevTimeBadge (nur Dev, lazy)<br /><i>fixiertes Overlay oben rechts bei aktivem Server-Zeit-Override (Shell ohne Top-Bar,<br />Mitarbeiter-App-Button in der Nav-Rail)</i></p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-actions-17" data-look="classic" transform="translate(2520.34765625, 4557.5)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-144.671875" y="-123" width="289.34375" height="246"/><g class="label" style="color:#eef1f6 !important" transform="translate(-114.671875, -108)"><rect/><foreignObject width="229.34375" height="216"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>actions/caseActions.ts<br /><i>getAvailableActions(): zentrale Registry (Status + assign/forward/attention-Flags)<br />→ ReasonDialog (mit Pflicht-Grund) · custom (assign/forward/attention/split) · sofort (Zurückholen, Aufmerksamkeit entfernen)</i></p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-shared-18" data-look="classic" transform="translate(2045.1796875, 4557.5)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-130" y="-555" width="260" height="1110"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -540)"><rect/><foreignObject width="200" height="1080"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>components/<br /><i>CaseActionMenu (Dichte compact/detail, EIN gemeinsames Kebab-Menü für alle Oberflächen) · AssignDialog (Live-Such-Combobox + „Durchsuchen“-Drawer, A1/A2/B1) · BelegSearchResultRow · AssignBrowseDrawer ·<br />ForwardDialog · AttentionDialog · MoveCaseDialog (B2) · TierChip ·<br />DataTable (Server-Modus · Füll-Modus flex:1 · Augen-Icon je Spaltenkopf = ausblenden, getrennt vom Sortier-Klick) ·<br />ColumnVisibilityMenu („Spalten“-Icon über der Tabelle: Checkbox-Liste, Rückweg zum Einblenden) ·<br />BelegInfoChips (EINE Kachel-/Zeilen-Infozeile: Filiale · Shop · Etikett/Digi Tag/Kein Etikett · Sicherung —<br />geteilt von den Ablagen-Karten und der Bündel-Auswahl; Aggregate kommen fertig vom Backend) ·<br />ReasonDialog (Pflicht-Grund; optional=true für die Zuordnungs-Gesten der DA.M.B-Matrix) ·<br />IssueMessageList (chronologischer Nachrichten-Verlauf einer Meldung — geteilt von InstructionsDialog + VerlaufTab)</i></p></span></div></foreignObject></g></g><g class="node default feat" id="my-svg-flowchart-experiment-9" data-look="classic" transform="translate(1807.6796875, 1478)"><rect class="basic label-container" style="fill:#16314a !important;stroke:#56b6ff !important" x="-184.71875" y="-1395" width="369.4375" height="2790"/><g class="label" style="color:#eef1f6 !important" transform="translate(-154.71875, -1380)"><rect/><foreignObject width="309.4375" height="2760"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>experiment/ExperimentPage („Experiment DA.M.B“)<br /><i>randloser 3-Fenster-Workspace: Beleg-Fenster als FLIP-KARTE (Tasche-Knopf mittig in der Kopfleiste):<br />vorn Beleg-Liste (eingebettet, Füll-Modus — Tabelle bis ganz unten), hinten VorverteilungPane —<br />Engine-Preview-Bündel (POST assignments/preview → bundles, Single-Source) als Grid im Matrix-Pack-Look<br />(Beleg-Striche via matrixPacks.stripStyle, MA-Vorschlag klickbar wechselbar), darunter EIN MA-Container<br />1./2./3. untereinander (je Zeile ein eigener Kasten) mit Bündel-Fortschrittsbalken je Name; Zahnrad (Anzahl 1–6 + Sperre);<br />Starterbündel-Ansicht (Knopf unten statt Vorschau-Hinweis): Schichtstart ≤ 1 h, orange Vorschläge — Klick übernimmt<br />bzw. Toggler „Automatisch übernehmen/erstellen“, echte Zuweisung exakt zum Schichtbeginn (assignBundle),<br />Generierung → Schnellaktionen-Popout (starterStatus.ts),<br />leer: „Kommende Starter anschauen“ — Container je Schichtgruppe Früh-/Spätschicht (weeklyPattern, Grid max 4/Reihe),<br />geteilter Automatik-Schalter, Pfeile/✕ je Beleg, DnD Ablage↔Bündel,<br />Bündel-Kopf auf Matrix-Zeile ziehen = echtes A1/A2-Zuweisen ·<br />AblagenPane = eingebettetes ORIGINAL-AblagenBoard<br />(eigener Saved-View-Key · dnd-Hooks: Lane-Drops parken/entparken/priorisieren/weiterleiten ·<br />Matrix-Drag → Vollflächen-POOL-RÜCKGABE: blauer Schleier + Recycling = entziehen,<br />3 s halten = Zielwahl Geparkt/Prio/Weiterleiten als withdraw-Kette) ·<br />MatrixBoard (ein Rechteck je Engine-Pack aus BoardRow.packs — die Pack-Zugehörigkeit kommt PERSISTIERT vom Backend<br />(AssignmentItem.packIndex), auch für manuell Zugewiesenes/Einsortiertes; je Pack steht sein Stand beim MA:<br />„abgearbeitet“ / „aktiv beim MA“ / „vorgeplant“ — vorgeplante sind in seiner App noch unsichtbar —, INNEN aufgeteilt wie die Board-Karte:<br />Laufend (n) / Geplant (n) / Fertig (n) · Belegstriche mit Statusfarben + Zugehörigkeits-Zeile,<br />Hover → Schnellinfo der Board-Karte, Klick → Belegdetails, Info-Kreis MatrixInfo + Zeilen-„!“ oben rechts,<br />Schicht-Pill Früh/Spät „ab HH:MM“, Schicht-Streifen = Pausen-Schieber: wächst als Farbband über die Namenszelle,<br />durchlaufende vertikale Trennwände zwischen den Slot-Spalten + „+ Nächstes Pack“-Slot<br />(NaechstesPackDialog → assignToEmployee newPack: vorgeplantes Pack im Tages-Bündel — NIE ein Zweit-Bündel, optional Nachricht) ·<br />Ablage-Beleg zwischen GEPLANT-Striche einsortieren (assign→reorder), LAUFEND nur mit Sicherheitsfrage,<br />jedes Pack ist Dropzone (PackBox + experimentDnd.packDropAction): Beleg-Strich → anderes Pack<br />DESSELBEN MA = umhängen, → Pack eines ANDEREN MA = mitarbeiterübergreifend verschieben —<br />beides EINE moveCase-Mutation mit targetPackIndex (Zeilen-Drop bleibt „ans Bündel-Ende“);<br />nicht verschiebbare Belege (laufend/fertig, §7.1) tragen statt der Griff-Punkte ein Schloss und<br />verweigern jeden Drop (Frei/Fix) · jedes Pack ist ein gültiges Ziel (kein pack-loser Sammelkasten mehr),<br />Abwesende (krank/urlaub) ganz unten durchgestrichen) ·<br />experimentLayout.ts: 3 Anordnungen (Matrix unten/rechts/links) per Umbau-Drag über den Anschlag,<br />Hochziehen minimiert das obere Fenster bis auf die Kopfzeile (px-genau gemessen, Titelleiste bleibt bedienbar),<br />Splitter-Segmente + Vollbild + Lupe ± je Fenster (CSS-only, keine Remounts) · alle Gesten → ReasonDialog/ForwardDialog<br />→ bestehende auditierte Mutationen (experimentDnd.ts / matrixPacks.ts / lib/schichtFarben.ts);<br />beim Zuordnen/Verschieben (Ablage→MA, MA→MA, Pack→Pack) ist der Grund OPTIONAL (07.08.2026) —<br />Audit-Event wird trotzdem geschrieben, nur ggf. ohne Text; Pause/Entziehen behalten den Pflicht-Grund ·<br />Schnellaktion-Fokus (fokus.ts): Router-State → Ziel-Fenster Vollbild,<br />betroffene Ablage-Karten/Matrix-Zeilen 3 s markiert + hingescrollt</i></p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-viewState-19" data-look="classic" transform="translate(1735.1796875, 4557.5)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>lib/viewState.ts<br /><i>persistierte Ansichten (localStorage paket.view.belege / .ablagen / .board / .nav /<br />.experiment / .experiment.belege / .experiment.ablagen / .experiment.zoom)</i></p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-mutations-15" data-look="classic" transform="translate(1258.625, 5633)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>mutations.ts<br /><i>preview · recalculate · exportZst · withdraw · add · assignToEmployee ·<br />assignBundleToEmployee (A1/A2) · moveCase (B2) · reorder · pause/resume</i></p></span></div></foreignObject></g></g><g class="node default logic" id="my-svg-flowchart-apiClient-16" data-look="classic" transform="translate(1800.7890625, 5870)"><rect class="basic label-container" style="fill:#1d222c !important;stroke:#8b7cf6 !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="color:#eef1f6 !important" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div style="color: rgb(238, 241, 246) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#eef1f6 !important" class="nodeLabel"><p>api.ts → @paket/api-client<br /><i>createApiClient · CURRENT_TEAMLEAD_ID</i></p></span></div></foreignObject></g></g></g></g><g class="node default ext" id="my-svg-flowchart-api-0" data-look="classic" transform="translate(1450.6171875, 6133)"><rect class="basic label-container" style="fill:#23272f !important;stroke:#7c8696 !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="color:#cbd2dd !important" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div style="color: rgb(203, 210, 221) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#cbd2dd !important" class="nodeLabel"><p>backend-api<br />/api/teamlead/* · /api/admin/* · /api/dev/* (nur Dev)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#FFFFFF"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#FFFFFF"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#cccccc" stop-opacity="1"/><stop offset="100%" stop-color="hsl(18